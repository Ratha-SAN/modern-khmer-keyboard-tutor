<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ម៉ាស៊ីនអង្គុលីលេខ · Typewriter</title>
<meta name="theme-color" content="#0b0a09">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;500;600&family=Noto+Serif:wght@400;600&family=Noto+Sans:wght@400;600&family=Noto+Serif+Khmer:wght@400;600&family=Noto+Sans+Khmer:wght@400;600&family=Kantumruy+Pro:wght@400;500&family=Battambang:wght@400;700&display=swap">
<style>
/* Khmer is bundled with the site, so it renders even if Google Fonts is unreachable */
@font-face{font-family:"Noto Serif Khmer Local";src:url(fonts/NotoSerifKhmer-400.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+1780-17FF,U+19E0-19FF,U+200C-200D,U+25CC}
@font-face{font-family:"Noto Serif Khmer Local";src:url(fonts/NotoSerifKhmer-600.woff2) format("woff2");font-weight:600 700;font-display:swap;unicode-range:U+1780-17FF,U+19E0-19FF,U+200C-200D,U+25CC}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
/* Layout: one dark room; a single device column stacked paper → carriage rail → tool strip → keys. */
:root{
  color-scheme:dark;
  --room:#0b0a09; --candle:#f29a2e;
  --paper-dim:#77736c; --paper-lit:#f4eedd; --paper-flat:#d8d2c3;
  --ink:#26211d; --hud:#f2ecdc; --hud-flat:#4a453f;
  --chassis:#8b8782; --well:#56534f; --tool:#b5b0a4; --tool-on:#f6f1e1;
  --kb:#4d4b49; --key:#8f8c89; --key-fn:#716e6b; --key-space:#a8a5a1; --key-down:#cbc7c1; --key-text:#ffffff;
  --panel:#262422; --panel-line:#3b3835; --panel-text:#ece6d6; --panel-mute:#a39d90;
  --rail:#1f1e1c; --head:#e8e1ce; --accent:#f0a23a;
  --face:"Special Elite","Courier Prime","Courier New",Courier,monospace;
  --ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --size:18px; --kh:clamp(36px,6.2vh,52px);
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
html{height:var(--app-h,100%);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{background:var(--room);color:var(--panel-text);font-family:var(--ui);overflow:hidden;
  background-image:radial-gradient(60vmax 50vmax at 100% 0%,rgba(242,154,46,.34),rgba(242,154,46,.08) 45%,transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

.device{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--chassis);--hx:30%}
@media (min-width:900px) and (min-height:640px){
  body{display:grid;place-items:center}
  .device{width:min(780px,94vw);height:min(94%,940px);border-radius:40px;border:10px solid #141312;
    box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px #2a2826}
}

/* paper */
.paper{position:relative;flex:1;min-height:0;overflow:hidden;
  background:radial-gradient(ellipse 70% 60% at 50% 100%,color-mix(in srgb,var(--chassis) 70%,#000),color-mix(in srgb,var(--chassis) 35%,#000) 70%)}
/* like a real machine, the print point stays still in the middle and the page rides the carriage past it:
   one step left for each letter, and a long slide back on a new line (--tx is set by follow) */
.page{position:absolute;top:0;bottom:0;left:0;right:0;margin-inline:auto;background:var(--paper-dim);transition:background .4s;
  transform:translateX(var(--tx,0px));box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 40px rgba(0,0,0,.55)}
.page.step{transition:background .4s,transform .07s cubic-bezier(.3,.7,.4,1) .1s}
.page.ret{transition:background .4s,transform .42s cubic-bezier(.55,0,.25,1)}
.light{position:absolute;inset:0;pointer-events:none;transition:opacity .4s;font-size:var(--size,18px);
  /* the pool of light sits just above the line being typed and drifts only part of the way with the carriage (--sx) */
  background:radial-gradient(ellipse 82% 58% at var(--sx,50%) calc(var(--anchor,80%) - 2.6em),
    var(--paper-lit) 0%,color-mix(in srgb,var(--paper-lit) 68%,var(--paper-dim)) 30%,color-mix(in srgb,var(--paper-lit) 26%,var(--paper-dim)) 58%,var(--paper-dim) 88%)}
/* light modes */
[data-light=flash] .page{background:color-mix(in srgb,var(--paper-dim) 64%,#000)}
[data-light=flash] .light{background:radial-gradient(circle clamp(120px,34vmin,220px) at var(--lx,50%) var(--ly,70%),
  var(--paper-lit) 0%,var(--paper-lit) 26%,color-mix(in srgb,var(--paper-lit) 62%,transparent) 52%,color-mix(in srgb,var(--paper-lit) 18%,transparent) 78%,transparent 100%)}
[data-light=beam] .page{background:color-mix(in srgb,var(--paper-dim) 70%,#000)}
/* the beam rises from the type head and leans toward the middle of the page (--tilt), with soft edges */
[data-light=beam] .light{background:conic-gradient(from calc(-62deg + var(--tilt,0deg)) at var(--hx) calc(var(--anchor,80%) + 40px),
  transparent 0deg,color-mix(in srgb,var(--paper-lit) 50%,transparent) 16deg,var(--paper-lit) 34deg,var(--paper-lit) 90deg,color-mix(in srgb,var(--paper-lit) 50%,transparent) 108deg,transparent 124deg,transparent 360deg);
  -webkit-mask-image:radial-gradient(circle at var(--hx) var(--anchor,80%),#000 0,#000 24%,rgba(0,0,0,.55) 56%,transparent 96%);
  mask-image:radial-gradient(circle at var(--hx) var(--anchor,80%),#000 0,#000 24%,rgba(0,0,0,.55) 56%,transparent 96%)}
/* candle: a steady flame, about 1900 K. Paper nearest the flame is a pale amber, deepening to orange-brown, with warm dark beyond */
[data-light=candle] .page{background:color-mix(in srgb,var(--paper-dim) 46%,#170a02)}
[data-light=candle] .light{background:radial-gradient(ellipse 135% 96% at 76% calc(var(--anchor,80%) * .5),
  color-mix(in srgb,var(--paper-lit) 70%,#ffc27a) 0%,color-mix(in srgb,var(--paper-lit) 52%,#ffa64d) 20%,color-mix(in srgb,var(--paper-lit) 30%,#e8852b) 44%,color-mix(in srgb,#b85f1c 34%,transparent) 70%,transparent 96%)}
[data-light=room] .page{background:var(--paper-flat)}
[data-light=room] .light,[data-light=off] .light{opacity:0}
[data-light=room]{--hud:var(--hud-flat)}
[data-light=off] .page{background:color-mix(in srgb,var(--paper-dim) 80%,#000)}
/* type slug stamping the page */
.strike{position:absolute;z-index:1;width:.62em;height:1.25em;border-radius:2px;background:var(--ink);opacity:0;pointer-events:none;font-size:var(--size)}
.scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;cursor:text;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 78px);mask-image:linear-gradient(to bottom,transparent 0,#000 78px)}
.scroll::-webkit-scrollbar{display:none}
.focus .scroll{
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.14) 60px,rgba(0,0,0,.14) calc(var(--anchor) - 5.2em),#000 calc(var(--anchor) - 2.4em));
  mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.14) 60px,rgba(0,0,0,.14) calc(var(--anchor) - 5.2em),#000 calc(var(--anchor) - 2.4em))}
.sheet{padding-inline:clamp(24px,10%,96px);font-size:var(--size)}
.grow{display:grid}
.grow>*{grid-area:1/1;min-width:0}
.txt{font-family:var(--face);font-size:1em;line-height:1.75;letter-spacing:normal;font-variant-ligatures:normal;font-feature-settings:normal;text-rendering:optimizeLegibility;white-space:pre-wrap;overflow-wrap:break-word;
  tab-size:4;margin:0;padding:0;border:0;color:var(--ink)}
.mirror{visibility:hidden;pointer-events:none}
/* the words are drawn by .show (a plain block shapes Khmer reliably); the textarea on top only takes input and shows the caret */
.show{pointer-events:none;opacity:.93}
/* typewriter faces: rough edges and uneven ink, as if struck through a ribbon */
.inked .show{filter:url(#ink);opacity:1}
.inked.heavy .show{filter:url(#ink2);font-weight:700}
textarea.txt{background:transparent;outline:0;resize:none;overflow:hidden;width:100%;height:100%;caret-color:#8e2420;
  color:transparent;-webkit-text-fill-color:transparent;-webkit-appearance:none;appearance:none;border-radius:0}
textarea.txt::placeholder{color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:.38}
textarea.txt::selection{background:rgba(240,162,58,.45);color:transparent}

.hud{position:absolute;inset:0 0 auto 0;z-index:3;display:flex;align-items:center;gap:6px;padding:8px 10px;color:var(--hud);pointer-events:none}
.hud>*{pointer-events:auto}
.hud .sp{flex:1;pointer-events:none}
.hb{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.count{font-family:var(--face);font-size:15px;letter-spacing:.06em;padding:10px 6px;font-variant-numeric:tabular-nums}
.clock{font-family:var(--face);font-size:15px;letter-spacing:.06em;color:var(--accent);font-variant-numeric:tabular-nums;
  background:rgba(20,18,16,.55);padding:4px 9px;border-radius:999px}
.toast{position:absolute;left:50%;top:58px;transform:translate(-50%,-6px);z-index:4;max-width:min(86%,420px);text-align:center;
  background:rgba(22,20,18,.92);color:var(--panel-text);font-size:13.5px;line-height:1.35;padding:8px 14px;border-radius:14px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* carriage rail */
/* the machine under the paper, drawn from above as the typist sees it. The carriage (platen roller, paper bail,
   knobs and return lever) rides with the page; the typebar basket, type guide and ribbon spools stay put */
.rail{position:relative;height:50px;flex:none;z-index:2;--brass:#c39a45;
  background:linear-gradient(#0e0d0c,#1d1b19 30%,#141311 85%,color-mix(in srgb,var(--chassis) 40%,#000))}
.carriage{position:absolute;left:-30px;right:-30px;top:0;height:18px;z-index:2;pointer-events:none;transform:translateX(var(--tx,0px))}
.rail.step .carriage{transition:transform .07s cubic-bezier(.3,.7,.4,1) .1s}
.rail.ret .carriage{transition:transform .42s cubic-bezier(.55,0,.25,1)}
.platen{position:absolute;left:18px;right:18px;top:2px;height:14px;border-radius:4px;
  background:linear-gradient(90deg,var(--brass) 0 7px,transparent 7px calc(100% - 7px),var(--brass) calc(100% - 7px)),
    linear-gradient(#5d5954,#1b1a19 38%,#0a0a09 72%,#3a3733);box-shadow:0 3px 5px rgba(0,0,0,.6)}
.knob{position:absolute;top:-1px;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#77716a,#232120 55%,#0b0b0a);box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 0 0 1.5px #3c3935}
.knob.l{left:0}.knob.r{right:0}
.bail{position:absolute;left:34px;right:34px;top:-8px;height:3px;border-radius:2px;
  background:linear-gradient(#f3dc9c,var(--brass) 55%,#6e5424);box-shadow:0 1px 2px rgba(0,0,0,.45)}
.bail b{position:absolute;top:-2px;width:16px;height:7px;border-radius:3px;background:linear-gradient(#3a3734,#0d0d0c)}
.bail b:first-child{left:20%}.bail b:last-child{right:20%}
.lever{position:absolute;left:6px;top:-2px;width:34px;height:4px;border-radius:2px;transform-origin:100% 50%;transform:translateX(-30px) rotate(28deg);
  background:linear-gradient(#f4f1ea,#9a958c 60%,#5d5953);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.lever::before{content:"";position:absolute;left:-6px;top:-3px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#a19c93 60%,#55514c)}
/* fixed parts, centred on the print point */
.spool{position:absolute;top:var(--spt,19px);width:24px;height:24px;margin-left:-12px;border-radius:50%;z-index:3;pointer-events:none;
  left:calc(var(--rx,50%) + var(--sp));transform:rotate(var(--spin,0deg));transition:transform .12s ease-out;
  background:radial-gradient(circle,#d7d1c6 0 2.5px,#26231f 3px 5px,transparent 5.5px),repeating-conic-gradient(#191715 0 10deg,#2a2724 10deg 20deg);
  box-shadow:0 0 0 2px #3b3834,0 2px 5px rgba(0,0,0,.6)}
.head{position:absolute;top:calc(var(--py,-40px) + 18px);left:var(--rx,50%);width:0;height:0;z-index:4}
/* the type guide, a small brass fork at the print point */
.head::before{content:"";position:absolute;left:-7px;top:-5px;width:10px;height:9px;border:2px solid var(--brass);border-top:0;border-radius:0 0 5px 5px;
  box-shadow:0 2px 2px rgba(0,0,0,.4)}
/* the typebar basket: one bar for every key, fanned out in a half ring in front of the platen. Each bar pivots
   on the brass segment halfway along, so when its key is struck it whips up over the segment and lands, face
   first, on the print point where all the bars meet. Built by buildBars() */
.fan{position:absolute;left:var(--rx,50%);top:var(--py,-14px);width:0;height:0;z-index:3;pointer-events:none}
.fan svg{position:absolute;overflow:visible}
.tbar{position:absolute;left:0;top:0;width:0;height:0}
.arm{position:absolute;top:0;transform-style:preserve-3d;transform-origin:50% var(--pv)}
.arm::before{content:"";position:absolute;left:50%;top:var(--pv);bottom:calc(var(--sh) - 2px);width:1.5px;margin-left:-.75px;
  background:linear-gradient(90deg,#55524e,#e9e5dd 45%,#7d7973)}
.slug{position:absolute;left:0;right:0;bottom:0;height:var(--sh);border-radius:2px;display:grid;place-items:center;transform:rotateX(0deg) rotate(var(--up));
  /* polished chrome: bright and dark bands across the face, a fine dark edge and a lit top lip */
  background:linear-gradient(160deg,#fdfdfd 0%,#c4c8cd 28%,#f6f7f8 46%,#9a9fa5 68%,#dfe2e6 86%,#b3b8be 100%);
  box-shadow:inset 0 0 0 1px #50555b,inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(0,0,0,.6)}
.slug b{font:700 var(--lf)/1 "Noto Sans Khmer","Noto Sans",var(--ui);color:#1c1f23;text-shadow:0 1px 0 rgba(255,255,255,.55);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;white-space:nowrap}
.tbar.hot{z-index:5}


/* tool strip */
.chassis{position:relative;flex:none;padding:6px 12px 10px;background:var(--chassis)}
.tools{display:flex;align-items:center;gap:2px;background:var(--well);border-radius:999px;padding:3px 8px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.18);overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tb{flex:1 1 44px;max-width:44px;min-width:28px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--tool);transition:color .15s,transform .15s}
.tb.on{color:var(--tool-on);filter:drop-shadow(0 0 5px rgba(255,236,190,.55))}
.tb.open{background:rgba(0,0,0,.25);color:var(--tool-on)}
.tb.chev.on{filter:none}
.collapsed .tb.chev{transform:rotate(180deg)}
.tools .gap{flex:1;min-width:6px}
.tools .div{flex:none;width:1px;height:22px;background:rgba(255,255,255,.16);margin:0 4px}
.collapsed .tb.fold{display:none}

.panel{position:absolute;left:12px;right:12px;bottom:calc(100% + 22px);z-index:6;background:var(--panel);color:var(--panel-text);
  border:1px solid var(--panel-line);border-radius:18px;padding:14px 16px 16px;box-shadow:0 16px 40px rgba(0,0,0,.55);
  max-height:min(62vh,440px);overflow-y:auto;font-size:14px}
.panel h4{margin:0 0 10px;font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--panel-mute)}
.panel h4:not(:first-child){margin-top:16px}
.rowset{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;background:#35322f;border:1px solid var(--panel-line);font-weight:500}
a.chip{display:inline-flex;align-items:center;color:var(--panel-text);text-decoration:none;font-size:14px}
.chip.sel{background:var(--head);color:#221f1c;border-color:var(--head)}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--panel-line);background:var(--c)}
.sw.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.field{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:44px;border-top:1px solid var(--panel-line)}
.field:first-of-type{border-top:0}
.field label{flex:1}
.field small{display:block;color:var(--panel-mute);font-size:12px;margin-top:1px}
.field select,.field input[type=number]{font:inherit;color:var(--panel-text);background:#35322f;border:1px solid var(--panel-line);border-radius:10px;height:36px;padding:0 8px}
.field input[type=number]{width:92px}
.field input[type=range]{width:min(46%,180px);accent-color:var(--accent)}
.field input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}

/* keys */
.kb{flex:none;background:var(--kb);padding:2px 6px calc(10px + env(safe-area-inset-bottom,0px));user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sg-row{display:flex;height:36px}
.sg{flex:1;min-width:0;color:#f1ede4;font:600 15px var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.sg+.sg{border-left:1px solid rgba(255,255,255,.12)}
.krow{display:flex;gap:clamp(4px,1.1vw,7px);margin-top:clamp(6px,1.1vh,9px);justify-content:center}
.krow.in{padding-inline:5%}
.k{flex:1 1 0;min-width:0;height:var(--kh);border-radius:8px;background:var(--key);color:var(--key-text);font:400 clamp(18px,2.6vh,23px) var(--ui);
  display:grid;place-items:center;box-shadow:0 1.5px 0 rgba(0,0,0,.5)}
.k.fn{flex:1.45 1 0;background:var(--key-fn);font-size:15px;font-weight:500}
.k.space{flex:5.4 1 0;background:var(--key-space)}
.k.down,.k:active{background:var(--key-down);color:#1d1b19;transform:translateY(1px);box-shadow:none}
.k.lit{background:var(--head);color:#1d1b19}
.kb.shift .k.l{text-transform:uppercase}
.kb.km .k,.kb.km .sg,.kpop.km{font-family:"Noto Serif Khmer","Noto Serif Khmer Local","Khmer MN","Khmer OS",var(--ui)}
.kb.km .k:not(.fn){font-size:clamp(16px,2.3vh,20px)}
/* the pressed key rises in a bubble above the finger, as on a phone keyboard */
.kpop{position:absolute;z-index:8;pointer-events:none;color:#1d1b19;font:400 30px var(--ui);filter:drop-shadow(0 5px 9px rgba(0,0,0,.5));
  opacity:0;transform:translateY(8px) scale(.86);transform-origin:50% 100%;transition:opacity .07s,transform .07s}
.kpop.on{opacity:1;transform:none}
.kpop b{display:grid;place-items:center;height:var(--h);border-radius:11px 11px 0 0;background:var(--key-down);font-weight:400;line-height:1}
.kpop i{display:block;height:10px;background:var(--key-down);clip-path:polygon(0 0,100% 0,calc(100% - var(--r)) 100%,var(--l) 100%)}
.kpop.km{font-size:28px}
@media (prefers-reduced-motion:reduce){.kpop{transition:none}}
.kb.km .krow{gap:clamp(3px,.8vw,6px)}
.k.space{font-size:14px;color:rgba(255,255,255,.85)}
.kb.caps .k[data-k=shift]{background:var(--head);color:#1d1b19}
.kb.shift:not(.caps) .k[data-k=shift]{background:var(--key-down);color:#1d1b19}
.k svg.i{width:21px;height:21px}
@media (max-height:520px){:root{--kh:30px}.sg-row{display:none}}

/* pages */
.pages{position:absolute;inset:0;z-index:10;background:var(--panel);display:flex;flex-direction:column}
.pages header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--panel-line)}
.pages h2{flex:1;margin:0;font:400 20px var(--face);letter-spacing:.04em}
.pages .list{flex:1;overflow-y:auto;padding:8px 12px 20px;display:flex;flex-direction:column;gap:8px}
.pg{display:flex;align-items:stretch;border:1px solid var(--panel-line);border-radius:14px;background:#2e2b29}
.pg.cur{border-color:var(--head)}
.pg .open{flex:1;min-width:0;text-align:left;padding:12px 14px}
.pg .t{font:400 16px var(--face);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg .m{font-size:12px;color:var(--panel-mute);margin-top:4px}
.pg .del{flex:none;min-width:48px;padding:0 12px;color:var(--panel-mute);border-left:1px solid var(--panel-line);font-size:13px;font-weight:600}
.pg .del.sure{color:#ff9d8a}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ---------- typing lessons ---------- */
.device.drill textarea.txt{caret-color:transparent}
/* a lesson is typed on the same line as free writing; the lines still to come stay below the edge of the paper */
.drill .scroll{-webkit-mask-image:linear-gradient(to bottom,#000 calc(var(--anchor) + 4px),transparent calc(var(--anchor) + 5px));
  mask-image:linear-gradient(to bottom,#000 calc(var(--anchor) + 4px),transparent calc(var(--anchor) + 5px))}
.drill.focus .scroll{-webkit-mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.14) 60px,rgba(0,0,0,.14) calc(var(--anchor) - 5.2em),#000 calc(var(--anchor) - 2.4em),#000 calc(var(--anchor) + 4px),transparent calc(var(--anchor) + 5px));
  mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.14) 60px,rgba(0,0,0,.14) calc(var(--anchor) - 5.2em),#000 calc(var(--anchor) - 2.4em),#000 calc(var(--anchor) + 4px),transparent calc(var(--anchor) + 5px))}
.gh{color:color-mix(in srgb,var(--ink) 34%,transparent)}
.cu{color:color-mix(in srgb,var(--ink) var(--c,34%),transparent);box-shadow:0 2px 0 #8e2420}
.cu.err{color:#c0281e;box-shadow:0 2px 0 #c0281e}
.prog{position:absolute;left:0;top:0;z-index:3;height:3px;width:calc(var(--pg,0)*100%);background:var(--accent);transition:width .15s}
.drill .sg-row{visibility:hidden}
.drill #shareBtn{display:none}
.khint{font:500 13px var(--ui);background:rgba(22,20,18,.7);border-radius:10px;padding:6px 10px;white-space:nowrap}
.k.hint{background:color-mix(in srgb,var(--accent) 55%,var(--key));box-shadow:0 0 0 2px var(--accent) inset}
.pages .tabs{display:flex;gap:6px}
.unit{border:0}
.unit summary{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;cursor:pointer;list-style:none;font:600 15px var(--ui)}
.unit summary::-webkit-details-marker{display:none}
.unit summary small{flex:1;color:var(--panel-mute);font-weight:400;font-size:12.5px}
.unit summary span{color:var(--panel-mute);font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums}
.unit .rows{display:flex;flex-direction:column;gap:8px;padding:2px 0 10px}
.pg .st{flex:none;align-self:center;padding:0 12px;color:var(--accent);letter-spacing:2px;font-size:15px}
.st .off{opacity:.22}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.tile{background:#2e2b29;border:1px solid var(--panel-line);border-radius:12px;padding:10px 8px;text-align:center;min-width:0}
.tile b{display:block;font:400 22px var(--face);font-variant-numeric:tabular-nums}
.tile span{font-size:11.5px;color:var(--panel-mute)}
.stat h4{margin:18px 2px 8px;font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--panel-mute)}
.stat svg{display:block;width:100%;height:auto;background:#2e2b29;border:1px solid var(--panel-line);border-radius:12px}
.stat svg text{font:10px var(--ui);fill:var(--panel-mute)}
.stat .none{color:var(--panel-mute);padding:6px 2px}
.wk{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:12px;background:#2e2b29;border:1px solid var(--panel-line)}
.wk b{font:400 20px var(--face)}
.wk span{font-size:12px;color:var(--panel-mute)}
.result{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:rgba(11,10,9,.62);padding:16px}
.result .card{background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;padding:18px 16px;width:100%;max-width:350px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.result h3{margin:0;font:400 19px var(--face)}
.result .st{display:block;font-size:26px;padding:8px 0 2px}
.result .nb{color:var(--accent);font-size:13px;min-height:18px;margin-bottom:8px}
.result .rowset{justify-content:center;margin-top:14px}
/* ---------- computer: a typewriter on a desk ----------
   With a mouse and a real keyboard the page is laid out like the machine itself: a sheet of paper standing in
   the lamplight, the carriage and tool strip beneath it, dark desk on either side. The phone keys stay hidden
   (they can still be shown from the tool strip), and sheets and panels open as cards instead of full screens. */
@media (min-width:900px) and (hover:hover) and (pointer:fine){
  body{display:flex;justify-content:center;align-items:stretch}
  .device{width:min(900px,calc(100vw - 96px));height:100%;border:0;border-radius:0;background:transparent;
    box-shadow:none;padding-top:28px}
  .paper{flex:1;background:transparent}
  .page{width:min(100%,780px);border-radius:3px 3px 0 0;box-shadow:0 -1px 0 rgba(255,255,255,.08),0 24px 80px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.45)}
  .sheet{padding-inline:clamp(56px,11%,110px)}
  .carriage{left:calc((100% - min(100%,780px))/2 - 30px);right:calc((100% - min(100%,780px))/2 - 30px)}
  .rail{border-radius:0 0 6px 6px}
  .chassis{border-radius:0 0 22px 22px;padding:8px 18px 14px;margin-bottom:22px;box-shadow:0 18px 40px rgba(0,0,0,.55)}
  .kb{max-width:760px;width:100%;margin:-12px auto 22px;border-radius:0 0 18px 18px;--kh:40px;padding-top:4px}
  .kb .k{font-size:17px}
  .panel{left:18px;right:auto;width:min(460px,calc(100% - 36px))}
  .hb:hover,.tb:hover{background:rgba(0,0,0,.18)}
  .k:hover:not(.down){filter:brightness(1.08)}
  .pages{inset:28px 40px 22px;border-radius:18px;border:1px solid var(--panel-line);box-shadow:0 30px 80px rgba(0,0,0,.7)}
  .pages .list{padding:12px 22px 26px}
  .pg:hover{border-color:#5a5550}
  .result .card{max-width:400px}
  .toast{top:64px}
}
@media (min-width:900px) and (hover:hover) and (pointer:fine) and (max-height:700px){
  .device{padding-top:12px}.chassis{margin-bottom:10px}.pages{inset:12px 32px 10px}
}

<script>
(()=>{
const $=id=>document.getElementById(id);

  kb=$('kb'),tools=$('tools'),panel=$('panel'),toastEl=$('toast'),countEl=$('count'),clockEl=$('clock'),pages=$('pages'),pageList=$('pageList');

  chev:'<path d="M9 5l7 7-7 7"/>',
  sound:'<path d="M7 9V4h10v5"/><rect x="3" y="9" width="18" height="10" rx="2"/><path d="M7 13h.01M11 13h.01M15 13h.01M8 16h8"/>',
  focus:'<circle cx="12" cy="12" r="3"/><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/>',
  page:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/>',
  ink:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="6.8" r="1.1"/><circle cx="7.5" cy="14.6" r="1.1"/><circle cx="16.5" cy="14.6" r="1.1"/>',
  lamp:'<path d="M9 4h6l3 7H6z"/><path d="M12 11v8M8 20h8"/>',
  set:'<path d="M4 7h9M19 7h1M4 12h2M12 12h8M4 17h11"/><circle cx="16" cy="7" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="18" cy="17" r="2.2"/>',
  bell:'<path d="M6 17v-6a6 6 0 0112 0v6l1.5 2h-15z"/><path d="M10 21.5h4"/>',
  timer:'<circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V9.5M10 3h4M12 3v3.5"/>',
  keys:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/>',
  shift:'<path d="M12 4l8 9h-5v7H9v-7H4z"/>',
  back:'<path d="M8 5h13v14H8l-6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/>',
  globe:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17"/>',
  emoji:'<circle cx="12" cy="12" r="8.5"/><path d="M8.5 14c1 1.6 6 1.6 7 0M9 9.5h.01M15 9.5h.01"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0012 0M12 17v4"/>',

/* ---------- state ---------- */
const LS='lamplight.v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function defaults(){const id=uid();return{docs:[{id,text:'',t:Date.now()}],cur:id,goal:3000,unit:'chars',sound:true,bell:true,lamp:true,focus:false,
  noErase:false,autoCap:true,osk:true,size:coarse?18:20,lang:'km',face:'type',faceV:3,ink:'black',paper:'ivory',collapsed:false}}
let S=defaults();
try{const j=JSON.parse(localStorage.getItem(LS));if(j&&Array.isArray(j.docs)&&j.docs.length){if(j.faceV!==3){j.face='type';j.faceV=3}S=Object.assign(S,j)}}catch(e){}
const LIGHTS={spot:'Spotlight',flash:'Flashlight',beam:'Projector beam',candle:'Candle',room:'Room light',off:'Lights off'};
if(!LIGHTS[S.light])S.light=S.lamp===false?'room':'spot';
let saveT;const save=()=>{S.sv=Date.now();clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}cloudSave()},300)};
let cloudSave=()=>{},haptic=()=>{};
let D=null; /* the typing lesson in progress, if any */
const doc=()=>S.docs.find(d=>d.id===S.cur)||S.docs[0];
/* a computer with a real keyboard starts without the phone keys, until someone turns them on themselves */
if(!coarse&&!S.oskChosen)S.osk=true;
/* every start opens on a blank page; earlier pages stay in the Pages list. Not saved until something is typed,
   so an untouched blank page never outranks a newer copy in Telegram's cloud. */
function freshPage(){const c=doc();if(c&&c.text){const n={id:uid(),text:'',t:Date.now()};S.docs.push(n);S.cur=n.id}
  S.docs=S.docs.filter(d=>d.text||d.id===S.cur)}
freshPage();
const INKS={black:'#26211d',blue:'#1f3a6e',red:'#8e2420',green:'#23523a',sepia:'#5a3d22'};
const PAPERS={ivory:['#77736c','#f4eedd','#d8d2c3'],grey:['#6c6d70','#e7e7e3','#c9c9c6'],kraft:['#7a6a52','#eedbb6','#cfbb96']};
const KHF='"Noto Serif Khmer Local","Khmer MN","Khmer Sangam MN","Leelawadee UI","Khmer UI","Khmer OS"';
const FACES={type:'"Special Elite","Kantumruy Pro","Noto Sans Khmer",'+KHF+',"Courier New",Courier,monospace',
  type2:'"Special Elite","Battambang","Noto Serif Khmer",'+KHF+',"Courier New",Courier,monospace',
  serif:'"Noto Serif","Noto Serif Khmer","Noto Sans Khmer",'+KHF+',Georgia,"Times New Roman",serif',
  sans:'"Noto Sans","Noto Sans Khmer","Noto Serif Khmer",'+KHF+',system-ui,-apple-system,"Segoe UI",Arial,sans-serif'};

/* ---------- sound ---------- */
let ac;
function audio(){try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C()}if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function noise(dur,freq,q,gain,when=0){const a=audio();if(!a)return;const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
  const g=a.createGain();g.gain.value=gain;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+when)}
function ding(when=0){const a=audio();if(!a)return;const t=a.currentTime+when;[[2093,.22],[4186,.07],[5274,.04]].forEach(([hz,v])=>{
  const o=a.createOscillator(),g=a.createGain();o.frequency.value=hz;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+1.3);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+1.35)})}

  if(kind==='bell'){if(S.bell)ding();return}

  else if(kind==='space'){noise(.07,650,.8,.65)}
  else if(kind==='back'){noise(.04,1500,1,.35)}
  else if(kind==='return'){noise(.3,1100,.6,.4);noise(.06,300,1,.6,.28);if(S.bell)ding(.05)}
}

/* ---------- paper follow ---------- */
let anchor=300,bellArmed=true,lh=28,caretX=0,pointing=false;
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;

   its place in the fan, and lands face first on the print point. Ink, paper and carriage react at the hit. */
let HIT=63,spin=0,lastIn='';
function stamp(kind){
  if(still)return;
  const head=device.querySelector('.head');
  if(kind!=='key'){ /* space and delete move the carriage but strike nothing */
    head.animate([{transform:'translateY(0)'},{transform:'translateY(1.5px)',offset:.4},{transform:'translateY(0)'}],{duration:110,easing:'ease-out'});return}

  const s=$('strike'),cw=S.size*.62;

/* ---------- the typebar fan ---------- */

const EN={Backquote:['`','~','`'],Digit1:['1','!','¡'],Digit2:['2','@','™'],Digit3:['3','#','£'],Digit4:['4','$','¢'],Digit5:['5','%','∞'],
  Digit6:['6','^','§'],Digit7:['7','&','¶'],Digit8:['8','*','•'],Digit9:['9','(','ª'],Digit0:['0',')','º'],Minus:['-','_','–'],Equal:['=','+','≠'],
  KeyQ:['q','Q','œ'],KeyW:['w','W','∑'],KeyE:['e','E','´'],KeyR:['r','R','®'],KeyT:['t','T','†'],KeyY:['y','Y','¥'],KeyU:['u','U','¨'],
  KeyI:['i','I','ˆ'],KeyO:['o','O','ø'],KeyP:['p','P','π'],BracketLeft:['[','{','“'],BracketRight:[']','}','‘'],Backslash:['\\','|','«'],
  KeyA:['a','A','å'],KeyS:['s','S','ß'],KeyD:['d','D','∂'],KeyF:['f','F','ƒ'],KeyG:['g','G','©'],KeyH:['h','H','˙'],KeyJ:['j','J','∆'],
  KeyK:['k','K','˚'],KeyL:['l','L','¬'],Semicolon:[';',':','…'],Quote:["'",'"','æ'],
  KeyZ:['z','Z','Ω'],KeyX:['x','X','≈'],KeyC:['c','C','ç'],KeyV:['v','V','√'],KeyB:['b','B','∫'],KeyN:['n','N','˜'],KeyM:['m','M','µ'],
  Comma:[',','<','≤'],Period:['.','>','≥'],Slash:['/','?','÷']};
const KROWS=[['Backquote','Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal'],
  ['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight','Backslash'],
  ['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote'],
  ['KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash']];
const BARS=KROWS.flatMap((r,ri)=>r.map((c,i)=>({c,x:i+[0,1.5,1.8,2.3][ri]+ri*.01}))).sort((p,q)=>p.x-q.x).map(o=>o.c);
const barEl={},mods={shift:false,alt:false};let fanW=0,fanB=0,fanSh=0;
function barMap(){return S.lang==='km'?KMP:EN}
function barLayer(){return mods.alt?2:(mods.shift||shift)?1:0}
function buildBars(){
  const fan=$('fan'),rail=fan&&fan.parentElement;if(!rail)return;
  const W=rail.clientWidth;if(!W||Math.abs(W-fanW)<2&&fan.childElementCount)return;fanW=W;

    {transform:X(182),offset:.33,easing:'cubic-bezier(.2,.7,.4,1)'},

/* dictation (works where the browser allows the microphone) */
function dictate(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const micKey=()=>kb.querySelector('[data-k=mic]');
  if(!SR){toast('Dictation is not available in this browser.');return}
  if(rec){rec.stop();return}
  try{
    rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang=S.lang==='km'?'km-KH':(navigator.language||'en-US');
    rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){const t=e.results[i][0].transcript.trim();
      if(t){const pre=ta.value.slice(0,ta.selectionStart);insert((pre&&!/\s$/.test(pre)?' ':'')+t,'key')}}};
    rec.onerror=e=>toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'The microphone is blocked here. Open this page in your browser to dictate.':'Dictation stopped.');
    rec.onend=()=>{rec=null;const m=micKey();m&&m.classList.remove('lit')};
    rec.start();const m=micKey();m&&m.classList.add('lit');toast('Listening. Tap the microphone again to stop.');
  }catch(err){rec=null;toast('Dictation is not available here.')}
}

const WORDS=('the be to of and a in that have I it for not on with he as you do at this but his by from they we say her she or an will my one all would there their what so up out if about who get which go me when make can like time no just him know take people into year your good some could them see other than then now look only come its over think also back after use two how our work first well way even new want because any these give day most us once upon story night light dark write writing letter love heart house door window rain morning evening always never little long old young great small world life hand eyes voice room street city quiet slowly suddenly something nothing everything someone remember forget believe between before again around through together tomorrow yesterday today beautiful different important thought thing where here were was been being very much more many should every still while under away down those though tonight typewriter paper candle').split(' ');
const CONTR=new Set(['there','here','that','it','he','she','we','they','you','i','what','who','where']);
let sgPrefix='';
function suggest(){
  const row=document.getElementById('sgRow');if(!row)return;
  const pre=ta.value.slice(Math.max(0,ta.selectionStart-32),ta.selectionStart);
  const m=pre.match(/[A-Za-z']+$/);sgPrefix=m?m[0]:'';
  let out;
  if(S.lang==='km'){
    const run=(pre.match(/[ក-៓៝]+$/)||[''])[0];let hits=[];sgPrefix='';
    for(let n=Math.min(6,run.length);n>0&&!hits.length;n--){const suf=run.slice(-n);hits=KMW.filter(w=>w.length>n&&w.startsWith(suf));if(hits.length)sgPrefix=suf}
    out=(hits.length?hits:['ខ្ញុំ','នេះ','ជា']).slice(0,3).map(w=>({w,label:w}));
  }else if(sgPrefix){
    const pl=sgPrefix.toLowerCase(),cap=/^[A-Z]/.test(sgPrefix),fix=w=>cap?w[0].toUpperCase()+w.slice(1):w;
    let c=CONTR.has(pl)?[sgPrefix+"'s",sgPrefix+"'ll"]:WORDS.filter(w=>w.length>pl.length&&w.toLowerCase().startsWith(pl)).slice(0,2).map(fix);
    out=[{w:sgPrefix,label:'“'+sgPrefix+'”'},...c.map(w=>({w,label:w}))];
  }else{
    const start=!pre.trim()||/[.!?]\s*$/.test(pre);
    out=(start?['I','The','It']:['the','and','to']).map(w=>({w,label:w}));
  }
  while(out.length<3)out.push({w:'',label:''});

function buildCourse(){
  const K=KMP,where={},units=[],lessons=[];
  for(const code in K)[0,1,2].forEach(l=>{const u=K[code][l];if(u&&!(u in where))where[u]={code,layer:l}});
  const outs=(codes,layer)=>codes.map(c=>K[c]&&K[c][layer]).filter(u=>u&&u.length<=3&&!/[​-‍]/.test(u));
  const R1=['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight','Backslash'],
    R2=['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote'],
    R3=['KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash'],
    R0=['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0'];
  const KW=window.WORDS||[],isCons=u=>u.length===1&&u>='ក'&&u<='ឳ';
  const canType=(w,set)=>{const n=w.length,ok=[true];for(let i=0;i<n;i++){if(!ok[i])continue;for(let L=1;L<=3&&i+L<=n;L++)if(set[w.substr(i,L)])ok[i+L]=true}return !!ok[n]};
  const KB=[
    {t:['ជួរគោល','Home row'],keys:()=>outs(R2,0)},{t:['ជួរខាងលើ','Top row'],keys:()=>outs(R1,0)},{t:['ជួរខាងក្រោម','Bottom row'],keys:()=>outs(R3,0)},
    {t:['Shift៖ ជួរគោល','Shift: home row'],keys:()=>outs(R2,1)},{t:['Shift៖ ជួរខាងលើ','Shift: top row'],keys:()=>outs(R1,1)},{t:['Shift៖ ជួរខាងក្រោម','Shift: bottom row'],keys:()=>outs(R3,1)},
    {t:['ជើងអក្សរ','Subscript consonants'],coeng:true,keys:()=>[COENG]},
    {t:['លេខ និងវណ្ណយុត្តិ','Numbers & punctuation'],digits:true,keys:()=>outs(R0,0).concat(['។','៕','ៗ'])},
    {t:['ពាក្យប្រើញឹកញាប់','Common words'],all:true,keys:()=>[]},{t:['ពាក្យវែង','Long words'],all:true,long:true,keys:()=>[]}];
  const learnedUpTo=i=>{const s={};for(let j=0;j<=i&&j<7;j++)KB[j].keys().forEach(u=>s[u]=1);if(i>=6)Object.keys(where).forEach(u=>{if(where[u].layer<2)s[u]=1});return s};
  const kmItems=i=>{
    const les=KB[i],N=20;let items=[];
    if(les.all){const set={};Object.keys(where).forEach(u=>set[u]=1);let pool=KW.filter(w=>canType(w,set));
      pool=les.long?pool.filter(w=>w.length>=6).slice(0,600):pool.slice(0,300);return shuffle(pool.slice()).slice(0,N)}
    if(les.digits){for(let d=0;d<N;d++){let s='';for(let k=0;k<3;k++)s+=rnd([...'០១២៣៤៥៦៧៨៩']);items.push(d%5===4?rnd(['។','៕','ៗ']):s)}return items}
    const learned=learnedUpTo(i),fresh=les.keys(),cons=Object.keys(learned).filter(isCons),vow=Object.keys(learned).filter(u=>!isCons(u)&&u!==COENG);
    if(les.coeng){
      const subs=[...'រនតលមយសវបទគក'].filter(c=>learned[c]),bases=[...'កសបពតចនម'].filter(c=>learned[c]);
      if(subs.length&&bases.length)for(let c=0;c<10;c++)items.push(rnd(bases)+COENG+rnd(subs)+(Math.random()<.5&&vow.length?rnd(vow):''));
      return items.concat(shuffle(KW.slice(0,1500).filter(w=>w.indexOf(COENG)>=0&&canType(w,learned))).slice(0,N-items.length));
    }
    const freshC=fresh.filter(isCons),freshV=fresh.filter(u=>!isCons(u)&&u!==COENG);
    for(let t=0;t<10;t++){let syl;
      if(freshC.length&&(t%2===0||!freshV.length))syl=rnd(freshC)+(vow.length?rnd(vow):'');
      else syl=(cons.length?rnd(cons):'អ')+rnd(freshV.length?freshV:vow.length?vow:['ា']);
      if(Math.random()<.5&&cons.length)syl+=rnd(cons);items.push(syl)}
    items=items.concat(shuffle(KW.slice(0,2500).filter(w=>canType(w,learned)&&fresh.some(u=>w.indexOf(u)>=0))).slice(0,N-items.length));
    while(items.length<N)items.push(rnd(items));return items;
  };
  if(Object.keys(K).length){
    units.push({id:1,icon:'⌨️',t:['មូលដ្ឋានក្ដារចុច','Keyboard basics']});
    KB.forEach((l,i)=>lessons.push({id:'k'+i,unit:1,lang:'km',t:l.t,make:()=>kmItems(i).join(' ')}));
  }
  (window.TEXT_UNITS||[]).forEach(u=>units.push({id:u.id,icon:u.icon,t:u.t}));
  (window.TEXTS||[]).forEach(x=>lessons.push({id:'t'+x.id,unit:x.unit,lang:'km',icon:x.icon,t:x.t,make:()=>x.text}));
  /* English */
  const ROWS=['asdfghjkl','qwertyuiop','zxcvbnm'],EW=WORDS.filter(w=>/^[a-z]+$/.test(w));
  const enRow=i=>{const fresh=[...ROWS[i]],learned=[...ROWS.slice(0,i+1).join('')],set=new Set(learned),items=[];
    for(let t=0;t<8;t++){let s='';const n=2+Math.floor(Math.random()*3);for(let k=0;k<n;k++)s+=rnd(k%2?learned:fresh);items.push(s)}
    return items.concat(shuffle(EW.filter(w=>[...w].every(c=>set.has(c))&&[...w].some(c=>fresh.includes(c)))).slice(0,14)).join(' ')};
  units.push({id:'en',icon:'🔤',t:['អង់គ្លេស','English']});
  [['ជួរគោល','Home row',()=>enRow(0)],['ជួរខាងលើ','Top row',()=>enRow(1)],['ជួរខាងក្រោម','Bottom row',()=>enRow(2)],
   ['ពាក្យប្រើញឹកញាប់','Common words',()=>shuffle(EW.slice()).slice(0,25).join(' ')],
   ['អក្សរធំ និងវណ្ណយុត្តិ','Capitals & punctuation',()=>shuffle(EN_SENT.slice()).slice(0,3).join(' ')],
   ['លេខ','Numbers',()=>{const a=[];for(let i=0;i<12;i++)a.push(String(100+Math.floor(Math.random()*900)));return a.join(' ')}]]
    .forEach((l,i)=>lessons.push({id:'e'+i,unit:'en',lang:'en',t:[l[0],l[1]],make:l[2]}));
  return {plat,units,lessons,where};
}
const getCourse=()=>(course&&course.plat===plat)?course:(course=buildCourse());

/* what the on-screen keys can print; anything else is skipped over on touch screens */
const oskSet=new Set([' ','។','៕']);Object.values(KM).forEach(l=>l.forEach(r=>r.forEach(k=>[...k].forEach(c=>oskSet.add(c)))));
const typable=c=>c<'\u0080'||oskSet.has(c)||(!coarse&&course&&c in course.where);
const CLUSTER=/[\s\S](?:្[ក-ឳ]|[ា-៓៝‌‍])*/gu;

function drillStats(){const mins=D&&D.t0?((D.t1||Date.now())-D.t0)/60000:0;
  return{w:mins>.02?Math.round(D.ok/5/mins):0,a:D&&(D.ok+D.bad)?Math.round(100*D.ok/(D.ok+D.bad)):100,secs:Math.round(mins*60)}}
function drillPaint(sh){
  const t=D.target,b=D.st[D.ci]||0,e=D.ci+1<D.st.length?D.st[D.ci+1]:t.length;
  if(D.n>=t.length){sh.textContent=t;return}
  const p=Math.round(34+48*(D.n-b)/Math.max(1,e-b)),err=Date.now()-D.errT<280;
  sh.innerHTML='<span>'+esc(t.slice(0,b))+'</span><span class="cu'+(err?' err':'')+'" style="--c:'+p+'%">'+esc(t.slice(b,e))+'</span><span class="gh">'+esc(t.slice(e))+'</span>';
}
function drillSkip(){const t=D.target;while(D.n<t.length&&!typable(t[D.n]))D.n++;while(D.ci+1<D.st.length&&D.st[D.ci+1]<=D.n)D.ci++}
function drillHint(){
  kb.querySelectorAll('.k.hint').forEach(k=>k.classList.remove('hint'));khint.hidden=true;
  if(!D||D.done||D.n>=D.target.length)return;
  const rest=D.target.slice(D.n,D.n+3),km=D.les.lang==='km';
  if(!coarse&&km&&course.where[rest[0]]){const w=course.where[rest[0]];
    const nm={Semicolon:';',Quote:"'",Comma:',',Period:'.',Slash:'/',BracketLeft:'[',BracketRight:']',Backslash:'\\',Minus:'-',Equal:'=',Backquote:'`',Space:'Space'};
    khint.textContent=(w.layer===1?'Shift + ':w.layer===2?(plat==='mac'?'Option + ':'AltGr + '):'')+(nm[w.code]||w.code.replace(/^(Key|Digit)/,''));khint.hidden=false}
  if(!S.osk)return;
  const lit=k=>{const b=kb.querySelector('.k[data-k="'+k+'"]');if(b)b.classList.add('hint')};
  if(rest[0]===' '){lit('space');return}
  let best=null;
  kb.querySelectorAll('.k:not(.fn):not(.space)').forEach(b=>{const k=(!km&&shift&&mode==='abc')?b.dataset.k.toUpperCase():b.dataset.k;
    if(rest.startsWith(k)&&(!best||k.length>best.len))best={b,len:k.length}});
  if(best){best.b.classList.add('hint');return}
  if(mode!=='abc'){lit('abc');lit('abc2');return}
  if(km){const inL=n=>KM[n].some(r=>r.some(k=>rest.startsWith(k)));
    if((inL('shift')&&!shift)||(inL('base')&&shift))lit('shift');else if(inL('num'))lit('123')}
  else if(/[a-z]/i.test(rest[0]))lit('shift');else lit('123');
}
function drillInput(){
  const t=D.target,v=ta.value,acc=t.slice(0,D.n);
  let extra='';
  if(!D.done&&v.length>acc.length){let p=0;while(p<acc.length&&v[p]===acc[p])p++;extra=v.slice(p,p+v.length-acc.length)}
  let good=0,miss=false,sp=false;
  for(const ch0 of extra){
    drillSkip();if(D.n>=t.length)break;
    const want=t[D.n],ch=(want===' '&&/[\n\t​]/.test(ch0))?' ':ch0;
    if(!D.t0)D.t0=Date.now();
    const ks=want!==' '?(LN().keys[want]||(LN().keys[want]=[0,0])):null;
    if(ch===want){D.n++;D.ok++;good++;sp=want===' ';if(ks)ks[0]++}
    else{D.bad++;miss=true;D.errT=Date.now();if(ks)ks[1]++;break}
  }
  drillSkip();
  ta.value=t.slice(0,D.n);ta.setSelectionRange(D.n,D.n);
  progEl.style.setProperty('--pg',D.n/Math.max(1,t.length));
  count();pointing=false;follow(true);
  if(good){stamp(sp?'space':'key');play(sp?'space':'key')}
  if(miss){if(S.sound)noise(.07,170,1.2,.75);haptic('heavy');setTimeout(()=>{if(D)follow(false)},300)}
  if(D.les.lang!=='km')paintShift();
  drillHint();
  if(!D.done&&D.n>=t.length)finishDrill();
}
function startDrill(id){
  const c=getCourse(),les=c.lessons.find(l=>l.id===id);if(!les)return;
  const target=String(les.make()||'').replace(/\s+/g,' ').trim();if(!target){toast('This lesson has no text yet.');return}
  const st=[];let m;CLUSTER.lastIndex=0;while((m=CLUSTER.exec(target)))st.push(m.index);
  const prev=D?D.prevLang:S.lang;
  D={id,les,target,st,ci:0,n:0,ok:0,bad:0,t0:0,t1:0,errT:0,done:false,prevLang:prev};
  learnEl.hidden=true;pages.hidden=true;resultEl.hidden=true;closePanel();
  device.classList.add('drill');progEl.hidden=false;progEl.style.setProperty('--pg',0);
  S.lang=les.lang;mode='abc';shift=0;buildKb();
  ta.placeholder='';ta.value='';drillSkip();
  layout();count();drillHint();focusTa();
  toast((les.icon?les.icon+' ':'')+les.t[0]+' · '+les.t[1]);
}
function exitDrill(toList){
  if(!D)return;
  if(!D.done&&D.t0){const d=LN().days,k=dkey(Date.now());d[k]=(d[k]||0)+Math.min(1800,Math.round((Date.now()-D.t0)/1000))}
  S.lang=D.prevLang;D=null;resultEl.hidden=true;
  device.classList.remove('drill');progEl.hidden=true;khint.hidden=true;
  kb.querySelectorAll('.k.hint').forEach(k=>k.classList.remove('hint'));
  ta.placeholder='Once upon a time…';ta.value=doc().text;ta.setSelectionRange(ta.value.length,ta.value.length);
  mode='abc';shift=0;buildKb();save();layout();lastN=count();autoShift();
  if(toList)showLearn();else focusTa();
}
function finishDrill(){
  D.done=true;D.t1=Date.now();
  const s=drillStats(),L=LN(),st=s.a>=97?3:s.a>=90?2:1,old=L.best[D.id],c=getCourse();
  const nb=!old||s.w>old.w;
  L.best[D.id]={w:Math.max(s.w,old?old.w:0),a:Math.max(s.a,old?old.a:0),s:Math.max(st,old?old.s:0)};
  L.hist.push({d:D.t1,i:D.id,w:s.w,a:s.a,s:s.secs,c:D.ok});if(L.hist.length>300)L.hist.splice(0,L.hist.length-300);
  const k=dkey(D.t1);L.days[k]=(L.days[k]||0)+s.secs;save();
  if(S.bell){ding();ding(.3)}
  const i=c.lessons.findIndex(l=>l.id===D.id),next=c.lessons[i+1];
  $('resultCard').innerHTML='<h3>'+esc((D.les.icon?D.les.icon+' ':'')+D.les.t[0])+'</h3><span class="st">'+starsHtml(st)+'</span>'+
    '<div class="nb">'+(nb&&old?'New best speed':st===3?'Clean typing':s.a<90?'Slow down a little: accuracy first':'')+'</div>'+
    '<div class="tiles"><div class="tile"><b>'+s.w+'</b><span>words / min</span></div><div class="tile"><b>'+s.a+'%</b><span>accuracy</span></div>'+
    '<div class="tile"><b>'+Math.floor(s.secs/60)+':'+String(s.secs%60).padStart(2,'0')+'</b><span>time</span></div></div>'+
    '<div class="rowset"><button class="chip" data-r="retry">Try again</button>'+(next?'<button class="chip sel" data-r="next" data-id="'+next.id+'">Next lesson</button>':'')+
    '<button class="chip" data-r="list">Lessons</button></div>';
  resultEl.hidden=false;khint.hidden=true;
}
resultEl.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b||!D)return;
  if(b.dataset.r==='retry')startDrill(D.id);else if(b.dataset.r==='next')startDrill(b.dataset.id);else exitDrill(true)});

/* ---------- lessons list and statistics ---------- */
function streak(days){let n=0;const t=new Date();if(!days[dkey(t)])t.setDate(t.getDate()-1);
  while(days[dkey(t)]){n++;t.setDate(t.getDate()-1)}return n}
function lessonsHtml(){
  const c=getCourse(),B=LN().best,nextL=c.lessons.find(l=>!B[l.id]);
  let h='<div class="rowset">'+(nextL?'<button class="chip sel" data-l="'+nextL.id+'">'+(Object.keys(B).length?'Continue':'Start')+': '+esc(nextL.t[0])+'</button>':'<span class="chip">Every lesson done</span>')+'</div>';
  c.units.forEach(u=>{
    const ls=c.lessons.filter(l=>l.unit===u.id);if(!ls.length)return;
    const done=ls.filter(l=>B[l.id]).length;
    h+='<details class="unit"'+(nextL&&nextL.unit===u.id?' open':'')+'><summary>'+u.icon+' '+esc(u.t[0])+'<small>'+esc(u.t[1])+'</small><span>'+done+' / '+ls.length+'</span></summary><div class="rows">'+
      ls.map(l=>{const b=B[l.id];return '<div class="pg"><button class="open" data-l="'+l.id+'"><div class="t">'+esc((l.icon?l.icon+' ':'')+l.t[0])+'</div><div class="m">'+esc(l.t[1])+(b?' · best '+b.w+' wpm · '+b.a+'%':'')+'</div></button><span class="st">'+starsHtml(b?b.s:0)+'</span></div>'}).join('')+'</div></details>';
  });
  return h;
}
function statsHtml(){
  const c=getCourse(),L=LN(),H=L.hist,B=L.best,ids=new Set(c.lessons.map(l=>l.id));
  const done=Object.keys(B).filter(i=>ids.has(i)),stars=done.reduce((a,i)=>a+B[i].s,0);
  if(!H.length)return '<div class="stat"><p class="none">No lessons finished yet. Finish one and your speed, accuracy and practice time will show here.</p><div class="rowset"><button class="chip sel" data-tab="lessons">Go to lessons</button></div></div>';
  const last=H.slice(-10),avg=k=>Math.round(last.reduce((a,x)=>a+x[k],0)/last.length);
  const secs=Object.values(L.days).reduce((a,b)=>a+b,0),mins=Math.round(secs/60);
  const tile=(v,l)=>'<div class="tile"><b>'+v+'</b><span>'+l+'</span></div>';
  let h='<div class="stat"><div class="tiles">'+tile(done.length+' / '+ids.size,'lessons done')+tile(stars,'stars')+tile(Math.max(...H.map(x=>x.w)),'best wpm')+
    tile(avg('w'),'avg wpm, last '+last.length)+tile(avg('a')+'%','avg accuracy')+tile(mins<60?mins+' min':(mins/60).toFixed(1)+' h','time practised')+
    tile(streak(L.days),'day streak')+tile(H.reduce((a,x)=>a+x.c,0).toLocaleString('en-US'),'characters')+'</div>';
  /* speed over the last lessons */
  const P=H.slice(-30),mx=Math.max(20,...P.map(x=>x.w))*1.15,X=i=>P.length>1?28+i*(262/(P.length-1)):159,Y=w=>78-w/mx*62;
  h+='<h4>Speed · last '+P.length+' '+(P.length===1?'lesson':'lessons')+' (words / min)</h4><svg viewBox="0 0 300 96" role="img" aria-label="Typing speed over the last '+P.length+' lessons">'+
    '<path d="M28 78H292M28 '+Y(mx/1.15/2).toFixed(1)+'H292" stroke="#3b3835" stroke-width="1" fill="none"/>'+
    '<text x="22" y="81" text-anchor="end">0</text><text x="22" y="'+(Y(mx/1.15/2)+3).toFixed(1)+'" text-anchor="end">'+Math.round(mx/1.15/2)+'</text>'+
    (P.length>1?'<polyline points="'+P.map((x,i)=>X(i).toFixed(1)+','+Y(x.w).toFixed(1)).join(' ')+'" fill="none" stroke="#f0a23a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>':'')+
    P.map((x,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(x.w).toFixed(1)+'" r="'+(i===P.length-1?3.5:2)+'" fill="#f0a23a"><title>'+x.w+' wpm, '+x.a+'%</title></circle>').join('')+
    '<text x="'+Math.min(280,X(P.length-1)).toFixed(1)+'" y="'+(Y(P[P.length-1].w)-7).toFixed(1)+'" text-anchor="middle" style="fill:#ece6d6">'+P[P.length-1].w+'</text></svg>';
  /* minutes per day, last 14 days */
  const days=[];for(let i=13;i>=0;i--){const t=new Date();t.setDate(t.getDate()-i);days.push({t,m:(L.days[dkey(t)]||0)/60})}
  const dm=Math.max(5,...days.map(d=>d.m));
  h+='<h4>Minutes practised · last 14 days</h4><svg viewBox="0 0 300 84" role="img" aria-label="Minutes practised per day over the last 14 days">'+
    days.map((d,i)=>{const bh=d.m?Math.max(3,d.m/dm*50):0,x=12+i*20;return '<rect x="'+x+'" y="'+(62-bh).toFixed(1)+'" width="14" height="'+bh.toFixed(1)+'" rx="3" fill="#f0a23a"><title>'+Math.round(d.m)+' min</title></rect>'+
      (d.m?'':'<rect x="'+x+'" y="60" width="14" height="2" rx="1" fill="#3b3835"/>')+'<text x="'+(x+7)+'" y="76" text-anchor="middle">'+d.t.getDate()+'</text>'}).join('')+'</svg>';
  /* keys that go wrong most */
  const weak=Object.keys(L.keys).map(k=>({k,n:L.keys[k][0]+L.keys[k][1],r:L.keys[k][1]/(L.keys[k][0]+L.keys[k][1])})).filter(x=>x.n>=6&&x.r>0).sort((a,b)=>b.r-a.r).slice(0,8);
  h+='<h4>Keys to practise</h4>'+(weak.length?'<div class="rowset">'+weak.map(x=>'<span class="wk"><b>'+esc(kmLabel(x.k))+'</b><span>'+Math.round(x.r*100)+'% missed</span></span>').join('')+'</div>':'<p class="none">No weak keys yet.</p>');
  const name=i=>{const l=c.lessons.find(x=>x.id===i);return l?(l.icon?l.icon+' ':'')+l.t[0]:i};
  h+='<h4>Recent lessons</h4>'+H.slice(-8).reverse().map(x=>'<div class="pg"><div class="open"><div class="t">'+esc(name(x.i))+'</div><div class="m">'+new Date(x.d).toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+x.w+' wpm · '+x.a+'% · '+Math.floor(x.s/60)+':'+String(x.s%60).padStart(2,'0')+'</div></div></div>').join('');
  return h+'<div class="rowset" style="margin-top:18px"><button class="chip" data-reset>Reset statistics</button></div></div>';
}
function showLearn(tab){
  if(tab)learnTab=tab;
  learnEl.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('sel',b.dataset.tab===learnTab));
  learnBody.innerHTML=learnTab==='stats'?statsHtml():lessonsHtml();
  learnEl.hidden=false;
}
learnEl.addEventListener('click',e=>{
  const l=e.target.closest('[data-l]'),t=e.target.closest('[data-tab]'),r=e.target.closest('[data-reset]');
  if(l){audio();startDrill(l.dataset.l)}
  else if(t)showLearn(t.dataset.tab);
  else if(r){if(!r.classList.contains('sure')){r.classList.add('sure');r.textContent='Erase all lesson results?';return}S.learn=null;save();showLearn()}
});
$('learnClose').addEventListener('click',()=>{learnEl.hidden=true;if(D)exitDrill(false);else focusTa()});

/* ---------- Telegram Mini App ----------
   Telegram opens the page with #tgWebAppData=… in the URL. Only then is Telegram's script loaded:
   it matches the header to the room, adds key haptics and a Back button for the sheets,
   and keeps the pages in Telegram's CloudStorage so they follow the account to every device. */
function tgBoot(){
  const tg=window.Telegram&&window.Telegram.WebApp;if(!tg||!tg.initData)return;
  const at=v=>tg.isVersionAtLeast&&tg.isVersionAtLeast(v);
  document.documentElement.classList.add('tg');
  tg.ready();tg.expand();
  try{if(at('6.1')){tg.setHeaderColor('#0b0a09');tg.setBackgroundColor('#0b0a09')}if(at('7.10'))tg.setBottomBarColor('#0b0a09');
    if(at('7.7'))tg.disableVerticalSwipes()}catch(e){}
  tg.onEvent('viewportChanged',fit);
  if(at('6.1'))haptic=s=>{try{tg.HapticFeedback.impactOccurred(s)}catch(e){}};
  /* Back button closes whichever sheet is open */
  if(at('6.1')){
    const sync=()=>{(!pages.hidden||!panel.hidden||!learnEl.hidden||D)?tg.BackButton.show():tg.BackButton.hide()};
    tg.BackButton.onClick(()=>{if(!panel.hidden)closePanel();else if(!learnEl.hidden)learnEl.hidden=true;else if(!pages.hidden){pages.hidden=true;focusTa()}else if(D)exitDrill(true);sync()});
    new MutationObserver(sync).observe(learnEl,{attributes:true,attributeFilter:['hidden']});
    new MutationObserver(sync).observe(device,{attributes:true,attributeFilter:['class']});
    new MutationObserver(sync).observe(pages,{attributes:true,attributeFilter:['hidden']});
    new MutationObserver(sync).observe(panel,{attributes:true,attributeFilter:['hidden']});
  }
  /* CloudStorage: values hold up to 4096 characters, so the state is split into chunks under a
     generation prefix ("a" or "b"); the head key is written last, so a half-finished save is never read */
  if(!at('6.9')||!tg.CloudStorage)return;
  const CS=tg.CloudStorage,N=4000;
  let gen='a',busy=false,again=false;
  const write=()=>{
    if(busy){again=true;return}busy=true;again=false;
    const s=JSON.stringify(S),g=gen==='a'?'b':'a',parts=[];for(let i=0;i<s.length;i+=N)parts.push(s.slice(i,i+N));
    let left=parts.length,failed=false;
    const done=()=>{busy=false;if(again)write()};
    parts.forEach((p,i)=>CS.setItem('lp'+g+i,p,err=>{if(err)failed=true;if(--left)return;
      if(failed){done();return}
      CS.setItem('lphead',g+':'+parts.length,err2=>{if(!err2){const old=gen;gen=g;
        CS.getKeys((e3,keys)=>{if(!e3&&keys){const stale=keys.filter(k=>k.startsWith('lp'+old)||(k.startsWith('lp'+g)&&+k.slice(3)>=parts.length));if(stale.length)CS.removeItems(stale)}})}
        done()})}));
  };
  let cloudT;cloudSave=()=>{clearTimeout(cloudT);cloudT=setTimeout(write,1500)};
  const bootSv=S.sv||0;
  CS.getItem('lphead',(err,head)=>{
    if(err||!head){cloudSave();return}
    const [g,n]=head.split(':');gen=g;const keys=[];for(let i=0;i<+n;i++)keys.push('lp'+g+i);
    CS.getItems(keys,(e2,vals)=>{
      if(e2||!vals)return;
      let j;try{j=JSON.parse(keys.map(k=>vals[k]||'').join(''))}catch(e){return}
      if(!j||!Array.isArray(j.docs)||!j.docs.length)return;
      if((j.sv||0)<=(S.sv||0)){if((S.sv||0)>(j.sv||0))cloudSave();return}
      if((S.sv||0)!==bootSv){cloudSave();return} /* typed here meanwhile: this device wins */
      S=Object.assign(defaults(),j);
      freshPage();
      try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
      applyLook();applyOsk();renderTools();buildKb();
      ta.value=doc().text;ta.setSelectionRange(ta.value.length,ta.value.length);lastN=count();autoShift();layout();
      toast('Pages synced from Telegram');
    });
  });
}
if(/tgWebApp/.test(location.hash+location.search)){
  const sc=document.createElement('script');sc.src='https://telegram.org/js/telegram-web-app.js';sc.onload=tgBoot;document.head.appendChild(sc);
}
})();
