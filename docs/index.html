<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>កម្មវិធីហាត់វាយអក្សរខ្មែរទំនើប</title>
<meta name="description" content="Learn to type Khmer on the standard NiDA keyboard for Windows and Mac: short lessons and arcade games.">
<meta name="theme-color" content="#f6f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="វាយខ្មែរ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="ui.css">
<style>
/* ---- home ---- */
.hero{padding-block:clamp(40px,8vw,84px) 28px;text-align:center}
.hero h1{font-size:clamp(2.1rem,5.4vw,3.4rem);font-weight:600;margin:0 0 8px;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
html[lang="km"] .hero h1{line-height:1.45}
.hero .sub{margin:0 0 30px;color:var(--muted);font-size:1.02rem}
.actions{display:flex;flex-direction:column;align-items:center;gap:16px}
.actions .btn.primary{padding:14px 30px;font-size:1.02rem;min-width:240px}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:600;font-size:.86rem;display:inline-flex;gap:8px;align-items:center;padding:6px 10px;border-radius:999px}
.linkbtn:hover{color:var(--ink);background:var(--raise)}
.band{padding-block:18px 34px}
section[id]{scroll-margin-top:70px}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
.shead h2{margin:0;font-size:1.3rem;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.lcard{position:relative;text-align:left;background:var(--panel);border:1.5px solid transparent;border-radius:20px;padding:16px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .15s,box-shadow .15s}
.lcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:transparent}
.lcard .n{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--raise);font:600 .92rem var(--ui);color:var(--ink)}
.lcard.cur{border-color:var(--accent)}
.lcard.cur .n{background:var(--accent);color:#fff}
.lcard.done .n{background:var(--home);color:var(--good)}
.lcard h3{margin:0;font-size:.98rem;font-weight:600;line-height:1.4}
.stars{color:var(--star);font-size:.95rem;letter-spacing:.12em;min-height:1.2em;line-height:1}
.stars .off{color:var(--line)}
.games{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.gcard{min-height:168px;justify-content:space-between;padding:18px;border:0}
.gcard .big{font:600 2.5rem/1 var(--text)}
.gcard h3{font-size:1.08rem}
.gcard .pill{align-self:flex-start;background:rgba(255,255,255,.75)}
.gcard[data-g=hunt]{background:linear-gradient(150deg,#fff6e6,#ffe7c2)}
.gcard[data-g=sprint]{background:linear-gradient(150deg,#eef4ff,#d9e6ff)}
.gcard[data-g=archer]{background:linear-gradient(150deg,#f6edff,#e5d3ff)}
.gcard[data-g=rain]{background:linear-gradient(150deg,#e9f7f1,#cdeedf)}
/* ---- play (focus mode) ---- */
body.playing .hero,body.playing #learn,body.playing #games,body.playing footer{display:none}
#play{padding-block:18px 28px}
.runbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.runbar h3{margin:0 auto 0 0;font-size:1.08rem;font-weight:600}
#runOpts{gap:8px}
#runOpts .seg button{padding:6px 12px;font-size:.84rem}
#runOpts>button{font-size:.84rem;padding:6px 14px}
#runOpts>.note{display:none}
.stage{padding:16px}
#newKeys{min-height:1.2em}
#progress{height:4px;background:var(--raise);border-radius:2px;overflow:hidden;margin:10px 0 12px}
#bar{height:100%;width:0;background:var(--accent);transition:width .2s}
.strip{position:relative;height:5.6rem;overflow:hidden;border-radius:18px;background:var(--raise);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 88%,transparent)}
#target{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;gap:26px;white-space:nowrap;font-size:2.15rem;transition:transform .28s cubic-bezier(.2,.7,.2,1)}
#target .w{position:relative;color:var(--muted);padding:0 4px;line-height:1.9}
#target .w.done{color:var(--good);opacity:.45}
#target .w.cur{color:var(--ink);background:var(--panel);border-radius:14px;padding:0 14px;box-shadow:var(--shadow)}
#target .w i{position:absolute;left:14px;right:14px;bottom:6px;height:3px;border-radius:2px;background:var(--line);overflow:hidden;display:none}
#target .w.cur i{display:block}
#target .w i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:var(--accent)}
.typedrow{margin-top:10px}
#echo{min-height:2.6rem;font-size:1.45rem;line-height:2.4rem;padding:0 14px;border-radius:14px;background:var(--raise);white-space:nowrap;overflow:hidden}
#echo::after{content:"";display:inline-block;width:2px;height:1.3rem;background:var(--accent);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.err{animation:shake .18s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#echo.err{box-shadow:inset 0 0 0 2px var(--bad)}
.hintline{color:var(--muted);font-size:.9rem;margin:10px 0 0;min-height:1.4rem;text-align:center}
.hintline b{color:var(--ink)}
.result{margin-top:14px;padding:22px;border-radius:var(--r-lg);background:var(--panel);box-shadow:var(--shadow-lg);text-align:center}
.result b{display:block;font-size:1.1rem;font-weight:600}
.result .stars{font-size:1.6rem;display:block;margin-top:6px}
.result .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hunt{display:grid;place-items:center;gap:6px;padding:18px;border-radius:18px;background:var(--raise);min-height:12rem}
.hunt .glyph{font:600 4.6rem/1.25 var(--text);color:var(--ink)}
.hunt .sub{color:var(--muted);font-size:.9rem;min-height:1.3em}
#rfield{position:relative;height:min(46vh,380px);border-radius:18px;overflow:hidden}
#rfield::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bad);opacity:.7}
.rw{position:absolute;top:0;left:0;padding:2px 16px;border-radius:999px;font-size:1.5rem;line-height:1.9;white-space:nowrap}
.rw i{position:absolute;left:14px;bottom:4px;height:3px;width:0;border-radius:2px}
.overlay{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:16px}
.overlay h4{margin:0}
#typeArea,.hunt{position:relative}
/* ---- keyboard: real Windows / Mac shape, keys sized in key units ---- */
.deck{margin-top:16px}
.kb{display:flex;flex-direction:column;gap:5px;user-select:none;-webkit-user-select:none;touch-action:manipulation;max-width:860px;margin:0 auto}
.kr{display:flex;gap:5px}
.k{position:relative;flex:var(--w,1) 1 0;min-width:0;height:clamp(40px,6.2vw,58px);background:var(--key);border:1px solid var(--line);border-bottom:3px solid var(--key-edge);border-radius:11px;padding:0;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.k::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--fc,transparent);opacity:.85}
.k.f0{--fc:var(--f0)}.k.f1{--fc:var(--f1)}.k.f2{--fc:var(--f2)}.k.f3{--fc:var(--f3)}.k.f4{--fc:var(--f4)}.k.f5{--fc:var(--f5)}.k.f6{--fc:var(--f6)}.k.f7{--fc:var(--f7)}
.k .b{position:absolute;left:0;right:0;top:50%;transform:translateY(-52%);text-align:center;font:clamp(.95rem,2.4vw,1.35rem) var(--text);color:var(--ink)}
.k .s,.k .a{position:absolute;font:clamp(.5rem,1.3vw,.72rem) var(--text);color:var(--muted)}
.k .s{right:4px;top:3px}.k .a{right:4px;bottom:2px}
.k .q{position:absolute;left:5px;top:3px;font:600 clamp(.45rem,1.1vw,.62rem) var(--ui);color:var(--muted);opacity:.8}
.k.mod{background:var(--raise)}
.k.mod .ml{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:600 clamp(.55rem,1.4vw,.78rem)/1.1 var(--ui);color:var(--muted);padding:0 2px}
.k.inert{cursor:default;opacity:.5}
.k.home{background:var(--home);border-color:color-mix(in srgb,var(--home-edge) 40%,transparent);border-bottom-color:var(--home-edge)}
.k.bump::after{content:"";position:absolute;left:50%;bottom:5px;width:30%;height:3px;margin-left:-15%;border-radius:2px;background:var(--home-edge)}
.k.on{background:var(--ink)}.k.on .ml{color:#fff}
.k.hint,.k.need{background:var(--hint);border-color:var(--hint);box-shadow:0 0 0 3px color-mix(in srgb,var(--hint) 35%,transparent)}
.k.hint .b,.k.hint .s,.k.hint .a,.k.need .ml,.k.hint .q{color:var(--hint-ink)}
.k.press{transform:translateY(2px)}
.kb.show-s .k .b,.kb.show-a .k .b{visibility:hidden}
.kb.show-s .k .s,.kb.show-a .k .a{left:0;right:0;top:50%;bottom:auto;transform:translateY(-52%);text-align:center;font-size:clamp(.95rem,2.4vw,1.35rem);color:var(--ink)}
.kb.show-s .k .a,.kb.show-a .k .s{visibility:hidden}
.kb.blind .k:not(.mod) .b,.kb.blind .k:not(.mod) .s,.kb.blind .k:not(.mod) .a{visibility:hidden!important}
/* ---- setup sheet ---- */
.steps{display:grid;gap:12px}
.steps .panel{box-shadow:none;background:var(--raise);padding:16px}
.steps h3{margin:0;font-size:.98rem}
.steps ul{margin:8px 0 0;padding-left:1.1em}
.steps li{margin:4px 0}
@media (max-width:640px){
  .hero{padding-block:30px 18px}
  .actions .btn.primary{min-width:0;width:100%}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .lcard{padding:14px}
  .gcard{min-height:140px}
  .stage{padding:12px}
  .strip{height:4.4rem}#target{font-size:1.6rem;gap:18px}
  #echo{font-size:1.2rem}
  .hunt .glyph{font-size:3.4rem}
  .deck{position:sticky;bottom:0;z-index:20;margin-inline:-14px;background:var(--panel);border-radius:20px 20px 0 0;padding:8px 3px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px -12px rgba(0,0,0,.25)}
  .kb{gap:4px}.kr{gap:2px}
  .k{height:clamp(38px,10.5vw,48px);border-radius:7px;border-bottom-width:2px}
  .k .q{display:none}
  .k .s,.k .a{font-size:.5rem}
  .k .b{font-size:clamp(.9rem,4.2vw,1.15rem)}
  .k.mod .ml{font-size:.5rem}
  .kr.r0{display:none}
  #runOpts .seg{flex-wrap:wrap}
}
</style>
</head>

  var t=rain.locked||rainLowest(function(it){return it.text.indexOf(u)===0});
  if(rain.locked&&rain.locked.text.substr(0,(rain.locked.typed+u).length)!==rain.locked.typed+u)t=null;
  if(!t){buzz();CBr.miss();A.play("bad");FXr.flash("rgba(255,59,59,.25)");return}
  rain.locked=t;FXr.burst(t.x+t.el.offsetWidth/2,t.y+t.el.offsetHeight/2,"#ffd34d",5);t.typed+=u;t.el.classList.add("lock");t.bar.style.width=(100*t.typed.length/t.text.length)+"%";
  if(t.typed===t.text){var mu=CBr.hit(),pts=t.text.length*10*mu,cx=t.x+t.el.offsetWidth/2,cy=t.y+t.el.offsetHeight/2;rain.score+=pts;rain.words++;FXr.burst(cx,cy,"#ffd34d",26);FXr.text(cx,cy,"+"+kmNum(pts),"#ffe58a",20);A.play("word");if(rain.words%8===0){rain.speed++;SCr.setTime(((rain.speed-1)%7)/7);A.banner($("rfield"),L2("ល្បឿន ","SPEED ")+kmNum(rain.speed))}t.el.remove();rain.items.splice(rain.items.indexOf(t),1);rain.locked=null;rainHud()}
}
function rainHint(){var t=rain.locked||rainLowest(function(){return true});if(!t){clearHint();return}var rem=t.text.substr(t.typed.length),best=null;Object.keys(where).forEach(function(u){if(rem.indexOf(u)===0&&(!best||u.length>best.length))best=u});showKeyHint(best,$("hintline"))}
function rainOver(){
  rain.running=false;A.play("over");clearHint();var k="nida_"+plat+"_g_rain",prev=+(store(k)||"0").replace(/\D.*/,"")||0;if(rain.score>prev)store(k,String(rain.score)+" "+T("score"));
  $("rTitle").textContent=T("gameOver");$("rText").textContent=T("rainEnd",{s:kmNum(rain.score),n:kmNum(rain.words)});$("rStart").textContent=T("playAgain")+" (Enter)";$("rOverlay").hidden=false;$("hintline").textContent="";
}
document.addEventListener("visibilitychange",function(){if(document.hidden&&rain.running){rain.running=false;cancelAnimationFrame(rain.raf);$("rTitle").textContent=L2("បានផ្អាក","Paused");$("rText").textContent="";$("rStart").textContent=L2("បន្ត","Resume");$("rOverlay").hidden=false;$("rStart").onclick=function(){$("rStart").onclick=function(){rainStart()};rain.running=true;rain.last=0;$("rOverlay").hidden=true;rain.raf=requestAnimationFrame(rainFrame)}}});

function input(u){
  if(!active)return;
  if(active.type==="lesson"||active.type==="sprint")practiceInput(u);
  else if(active.type==="hunt")huntInput(u);
  else if(active.type==="rain")rainInput(u);
  else if(active.type==="archer"&&ARCH)ARCH.input(u);
}
